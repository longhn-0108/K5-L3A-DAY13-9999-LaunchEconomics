# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Phương án đề xuất cho Gate 2a
#
# D1 · Cỡ mẫu (baseline 0,70, alpha 0,05, power mục tiêu 0,80, ICC 0,02)
#   a) Chia theo yêu cầu với MDE 5 điểm phần trăm cần 1.251 yêu cầu mỗi nhánh.
#   b) Chia theo nhân viên với 75 yêu cầu/người có hệ số thiết kế 2,48, cần khoảng 3.103 yêu cầu và 42 nhân viên mỗi nhánh. Tổng 84 người vượt 40 người hiện có.
#   c) Với 20 nhân viên mỗi nhánh, trần cỡ mẫu hiệu dụng là 1.000 mỗi nhánh, dưới 1.251 nên chưa đủ để phát hiện chênh lệch 5 điểm phần trăm.
#   d) Với 6 depot mỗi nhánh, trần cỡ mẫu hiệu dụng là 300 mỗi nhánh.
#   e) Với MDE 6 điểm phần trăm cần 859 yêu cầu hiệu dụng mỗi nhánh. Với 20 nhân viên mỗi nhánh, cần ít nhất 299 yêu cầu/người, tức 5.980 yêu cầu thực tế mỗi nhánh, với hệ số thiết kế 6,96. Power ở mức chênh lệch 5 điểm phần trăm khoảng 0,64.
#
# D2 · Năm câu kiểm tra khả năng tách tác động
#   1. Hai nhánh chạy cùng tuần tại cùng depot. Đối chứng làm theo quy trình hiện tại.
#   2. Dùng mã để bốc thăm nhân viên theo depot với seed ghi trước, cân bằng trong từng depot và giữ tổng 20 người mỗi nhánh.
#   3. Nhân viên cùng depot có thể chia sẻ gợi ý. Giới hạn quyền theo tài khoản, yêu cầu giữ gợi ý trong nhánh trợ lý và ghi lượt truy cập theo staff_id.
#   4. Trước khi bắt đầu, chốt chỉ số đóng trong 24 giờ và không mở lại trong 7 ngày, ngưỡng ra quyết định, các luật dừng và ngày quyết định dự kiến.
#   5. Mỗi nhánh có 20 cụm, mỗi nhân viên là một cụm. Đủ 20 cụm dùng trợ lý từ bước 50%.
#
# Phương án đã chốt gồm 20 nhân viên dùng trợ lý và 20 nhân viên đối chứng.
# Chọn MDE 6 điểm phần trăm vì với 40 nhân viên, cách chia theo nhân viên không đủ mẫu cho MDE 5 điểm. Power mục tiêu là 0,80 với MDE 6 điểm.
#
# D3 · Số chạy thử giả lập ghi nhận 51/1.200 = 4,25% mở lại trong 7 ngày toàn mẫu và 39/982 = 3,97% trong phạm vi pilot.
# Ngưỡng pilot đề xuất là cao hơn đối chứng từ 2 điểm phần trăm hoặc vượt 6% tuyệt đối.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: >-
    Chỉ gồm noi_dia và hang_nang. Theo A3, tỷ lệ thành công lần lượt là 95,0% và 74,1%,
    với chi phí mỗi việc thành công là 2.696 đ và 8.221 đ (simulated), dưới mốc giả định 12.000 đ nếu nhân viên tự làm.
    Loại quoc_te vì chi phí 22.515 đ (simulated) và doi_tac vì có điều khoản riêng và chi phí 10.215 đ (simulated).
    Chọn depot có đủ nhân viên để bố trí cả hai nhánh, có lưu lượng phù hợp với mục tiêu mẫu và ghi được dữ liệu theo dõi
    an toàn, chi phí và xem lại theo depot và staff_id. Chốt danh sách sau khi kiểm tra đủ 40 nhân viên và lưu lượng dự kiến.
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
  # Tỷ lệ trên 40 nhân viên tương ứng 4 → 10 → 20 người được bật trợ lý. Bốc thăm trước thứ tự bật trong nhánh trợ lý, cân bằng theo depot.
  # Mỗi bước tối thiểu một tuần. Giữ bước hiện tại trong khi chờ nhóm yêu cầu của tuần đó đủ 7 ngày theo dõi và kiểm tra các luật dừng.
  # Giữ nguyên 20 nhân viên đối chứng. Chỉ đưa yêu cầu tiếp nhận từ bước 50% vào phân tích hiệu quả của hai nhánh.
  rollout: [0.10, 0.25, 0.50]
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # Cỡ mẫu hiệu dụng. Kế hoạch thu ít nhất 5.980 yêu cầu thực tế mỗi nhánh.
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: >-
      So sánh hai nhánh trong cùng depot, cùng tuần và cùng phạm vi yêu cầu.
      Phân tích theo nhánh được phân ngẫu nhiên, có tính đến phân tầng theo depot và phân cụm theo nhân viên.
    spillover_risk: >-
      Nhân viên có thể chia sẻ gợi ý trong depot. Chỉ cấp quyền cho tài khoản đã bật trợ lý,
      giữ gợi ý trong nhánh trợ lý và ghi lượt truy cập theo staff_id để phát hiện truy cập sai nhánh.
    predeclared: >-
      Chốt trước khi bắt đầu chỉ số chính, tiêu chí mở rộng, luật dừng và lịch quyết định dự kiến.
      Đánh giá khi mỗi nhánh có đủ 20 cụm, ít nhất 299 yêu cầu mỗi nhân viên, đạt 859 yêu cầu hiệu dụng
      sau khi tính đến quy mô cụm và đủ thời gian xác định kết quả 24 giờ và theo dõi mở lại 7 ngày.
      Đề xuất mở rộng khi mức cải thiện ước tính của nhánh trợ lý so với đối chứng đạt ít nhất
      5 điểm phần trăm, cận dưới của khoảng tin cậy hai phía 95% cho chênh lệch này lớn hơn 0
      và kết quả theo dõi đáp ứng các điều kiện tiếp tục của cả ba luật dừng.
  stop_rules:
    - >-
      NẾU tỷ lệ mở lại trong 7 ngày của nhánh trợ lý cao hơn đối chứng từ 2 điểm phần trăm hoặc vượt 6%
      TRONG một tuần tiếp nhận, so cùng tuần và cùng depot, chỉ tính các yêu cầu đã đủ 7 ngày theo dõi ở cả hai nhánh
      THÌ Giám đốc vận hành dừng trợ lý theo quy trình rollback và rà nguyên nhân trước khi duyệt chạy lại
      KHÔNG THÌ tiếp tục ở bước hiện tại và chỉ tăng rollout khi đủ dữ liệu theo dõi và đạt cả ba luật.
    - >-
      NẾU chi phí biến đổi mỗi việc thành công vượt 8.000 đ ở nhánh trợ lý trong phạm vi noi_dia và hang_nang,
      tính tổng token và tool của mọi lượt thử cộng chi phí xem lại và làm lại, chia cho số việc thành công,
      chưa gồm chi phí cố định
      TRONG 2 tuần liên tiếp có số liệu đầy đủ
      THÌ Giám đốc vận hành giữ mức rollout để rà thời gian xem lại, làm lại và chi phí theo loại yêu cầu trước khi duyệt tăng
      KHÔNG THÌ chỉ tăng rollout khi tuần đo đầy đủ gần nhất có chi phí không quá 8.000 đ và đạt các luật còn lại.
    - >-
      NẾU tỷ lệ sửa hoặc bỏ gợi ý vượt 40% trên số yêu cầu của nhánh trợ lý đã được nhân viên xem lại
      TRONG 1 tuần
      THÌ Trưởng nhóm CSKH giữ mức rollout hiện tại và rà các lý do sửa hoặc bỏ gợi ý với nhân viên
      KHÔNG THÌ tiếp tục ở mức hiện tại và chỉ tăng rollout khi tỷ lệ của tuần đo không quá 40% và đạt các luật còn lại.
  interim_looks: >-
    Xem chỉ số an toàn giữa kỳ trên các yêu cầu đã đủ thời gian theo dõi. Theo dõi chi phí và mức sử dụng theo các cửa sổ của luật dừng.
    Đo tỷ lệ xem lại và số phút mỗi lần xem để đối chiếu kịch bản xem lại toàn bộ ở B4.
    Giữ mức rollout khi dữ liệu chưa đủ để kiểm tra các luật. Chỉ phân tích hiệu quả một lần ở mốc quyết định khi đủ mẫu và theo dõi.
  rollback: >-
    Giám đốc vận hành tắt cờ trợ lý, chặn lượt xử lý mới bằng trợ lý và khôi phục luồng nhân viên tự làm trong 30 phút kể từ quyết định dừng.
    Trưởng nhóm CSKH chuyển yêu cầu đang mở vào hàng đợi nhân viên kèm tóm tắt, trạng thái và trace_id.
    Nhân viên kiểm tra trạng thái ghi sổ trước khi tiếp tục để tránh hoàn trùng.
  # Lịch giả định cần xác nhận. Khởi động 30/11/2026, dự kiến thu mẫu bước 50% từ 04 đến 17/01/2027.
  # Cần thu ít nhất 11.960 yêu cầu trong 14 ngày (khoảng 855/ngày ở hai nhánh), đủ 299 mỗi người.
  # Dành thêm thời gian cho cửa sổ đóng 24 giờ và theo dõi mở lại 7 ngày. Dời ngày quyết định nếu mẫu hoặc theo dõi chưa đủ.
  decision_date: "2027-01-26"
  simulated_inputs:
    - >-
      Giá giả định của lab gồm 26 đ và 130 đ mỗi 1.000 token vào và ra, 15 đ mỗi lần gọi tool,
      2.000 đ mỗi phút nhân viên và 12.000 đ mỗi yêu cầu nhân viên tự làm.
      Chi phí xem lại và làm lại trong số chạy thử lấy từ phut_xem_lai_simulated và phut_lam_lai_simulated.
    - >-
      A4 (simulated) giả định chi phí cố định 40 triệu đ/tháng. Trong phạm vi pilot,
      chi phí gồm cố định là 4.599 đ/việc thành công ở 45.000 yêu cầu/tháng và 5.784 đ ở 22.500 yêu cầu/tháng.
      Hai mức khối lượng này dùng để đối chiếu kịch bản, còn luật dừng chi phí dùng chi phí biến đổi.
    - >-
      B4 (simulated) giả định xem lại 100% với 5 phút/lần. Chi phí biến đổi là 11.743 đ/việc thành công
      nếu làm lại 9 phút/ca, hoặc 12.415 đ với 15,3 phút/ca tính từ dữ liệu giả lập.
      Mốc hòa vốn tương ứng là 5,1 hoặc 4,8 phút/lần xem (simulated).
    - >-
      Tỷ lệ mở lại trong dữ liệu chạy thử giả lập (simulated) là 51/1.200 = 4,25% toàn mẫu và
      39/982 = 3,97% trong phạm vi pilot. Baseline 0,70 và ICC 0,02 là giả định của lab để tính cỡ mẫu.